# Statische Prüfung aller RouterOS-Skripte auf bekannte Fallen (tools/rsc-check.py).
# :parse und e2e.sh laufen bewusst lokal im CHR-Labor (tools/chr-lab), siehe docs/DECISIONS.md DT1.2.
name: rsc-check

on:
  push:
  pull_request:

jobs:
  rsc-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests des Prüfskripts
        run: python3 tools/rsc-check-test.py -v
      - name: RouterOS-Fallen in allen .rsc-Dateien
        run: python3 tools/rsc-check.py
      - name: Feature-Module je Site (DG4.6)
        run: python3 tools/feature-module-test.py -v
      - name: wifi-sign.py (WLAN-Schild als PDF)
        run: |
          sudo apt-get install -y -q python3-segno python3-cairo
          /usr/bin/python3 tools/wifi-sign-test.py -v
      - name: upload-seed.sh gegen einen nachgebauten SFTP-Server
        run: python3 tools/upload-seed-test.py -v
      - name: new-site.py erzeugt eine prüfbare Site
        run: python3 tools/new-site.py "$RUNNER_TEMP/site-ci" --name cm-ci --uplink ether2 --user ci --mgmt-extra 10.0.0.0/8
